<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <style>
        .wave01 {
            width: 300px;
            height: 300px;
            background-color: aquamarine;
            transition: border-radius 3s linear;
            border-radius: 60% 40% 50% 50% / 35% 45% 55% 65%;
            position: relative;
            animation: item 5s infinite, shake 5s infinite linear;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wave01 .imgbox {
            width: 300px;
            /* 調整圖片大小 */
            position: absolute;
        }

        @keyframes item {
            0% {
                border-radius: 60% 40% 50% 50% / 35% 45% 55% 65%;
            }

            25% {
                border-radius: 45% 55% 37% 63% / 56% 36% 54% 44%;
            }

            50% {
                border-radius: 59% 41% 68% 32% / 48% 52% 48% 62%;
            }

            75% {
                border-radius: 50% 50% 39% 61% / 61% 69% 31% 39%;
            }

            100% {
                border-radius: 60% 40% 50% 50% / 35% 45% 55% 65%;
            }
        }

        @keyframes shake {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-45px);
            }

            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="wave01">
        <img src="./src/assets/img/advantageTitle/advantagetitle004.png" class="imgbox" alt="">
    </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</html>
